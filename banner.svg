<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0716"/>
      <stop offset="50%" stop-color="#1a0b2e"/>
      <stop offset="100%" stop-color="#2a0f1f"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff7a59"/>
      <stop offset="50%" stop-color="#ff3d9a"/>
      <stop offset="100%" stop-color="#7c5cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ff7a59" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff7a59" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <circle cx="960" cy="160" r="220" fill="url(#glow)"/>
  <g fill="none" stroke="url(#neon)" stroke-width="2" opacity="0.9">
    <circle cx="960" cy="160" r="150"/>
    <circle cx="960" cy="160" r="100" stroke-opacity="0.5"/>
    <line x1="960" y1="10" x2="960" y2="310" stroke-opacity="0.25"/>
    <line x1="810" y1="160" x2="1110" y2="160" stroke-opacity="0.25"/>
  </g>
  <g fill="#ffe4d6" opacity="0.9" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" text-anchor="middle">
    <text x="960" y="155" font-size="16" font-weight="bold" fill="#ff7a59">DROP</text>
    <text x="960" y="175" font-size="14">PNG · MP4 · PDF · DOCX</text>
  </g>
  <text x="80" y="150" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="92" font-weight="800" fill="url(#neon)">DropWheel</text>
  <text x="84" y="200" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="26" fill="#d9cfe8">Drag a file. Drop it on the wheel. Done.</text>
  <text x="84" y="245" font-family="Consolas, Menlo, monospace" font-size="18" fill="#ff7a59">Super + Shift + W   →   convert on KDE Plasma</text>
</svg>
